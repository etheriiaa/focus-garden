<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>better forest™ - site blocked</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e9f0e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #2f4835;
    }
    .shield-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 32px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 440px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      border: 2px solid #bdd7c7;
    }
    .shield-icon {
      font-size: 4rem;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.8rem;
      margin: 0 0 0.5rem;
      font-weight: 800;
    }
    p {
      font-size: 0.95rem;
      color: #667e6c;
      line-height: 1.5;
      margin: 0 0 1.8rem;
    }
    .btn-return {
      background: #1f7e51;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: transform 0.2s, background 0.2s;
    }
    .btn-return:hover {
      background: #186340;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="shield-card">
    <div class="shield-icon">🛡️🌱</div>
    <h1>locking in!</h1>
    <p>this website is blocked while your focus session is active. return to your work so your plant can bloom!</p>
    <a href="https://etheriiaa.github.io/focus-garden/" class="btn-return">← back to focus garden</a>
  </div>
</body>
</html>
