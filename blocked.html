<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>better forest™ - plant died</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fbf0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #4a2c2c;
    }
    .shield-card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 32px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 460px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      border: 2px solid #e0b4b4;
    }
    .shield-icon {
      font-size: 4rem;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.8rem;
      margin: 0 0 0.5rem;
      font-weight: 800;
      color: #b33939;
    }
    p {
      font-size: 0.95rem;
      color: #7d5a5a;
      line-height: 1.5;
      margin: 0 0 1.8rem;
    }
    .btn-return {
      background: #1f7e51;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: transform 0.2s, background 0.2s;
    }
    .btn-return:hover {
      background: #186340;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="shield-card">
    <div class="shield-icon">🥀🛑</div>
    <h1>your plant died!</h1>
    <p id="deathMessage">why were you even trying to go to that site anyway? smh</p>
    <a href="https://etheriiaa.github.io/focus-garden/" class="btn-return">← back to focus garden</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const site = params.get('site');
    if (site) {
      document.getElementById('deathMessage').innerText = `you visited "${site}" while locking in, and your plant died`;
    }
  </script>
</body>
</html>
